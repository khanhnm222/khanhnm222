<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="244" viewBox="0 0 1080 244" role="img" aria-label="Cờ Tướng Vui — play Chinese chess against the computer, a friend, or online, plus checkmate puzzles.">
  <style>
